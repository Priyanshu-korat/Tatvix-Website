[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  # Existing project variables classify these already-public business details as
  # secrets. SMTP_USER is the public contact mailbox, not its password.
  # Keep scanning enabled for all other keys, especially SMTP_PASSWORD.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_BUSINESS_NAME,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_BUSINESS_ADDRESS,NEXT_PUBLIC_BUSINESS_CITY,NEXT_PUBLIC_BUSINESS_EMAIL,CONTACT_EMAIL,SMTP_USER,NEXT_PUBLIC_BUSINESS_STATE,NEXT_PUBLIC_BUSINESS_COUNTRY,NEXT_PUBLIC_LINKEDIN_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Next.js is handled by Netlify's automatically maintained OpenNext adapter.
# Do not add an SPA catch-all: pages and route handlers require server rendering.

[[redirects]]
  from = "https://tatvixtech.com/*"
  to = "https://www.tatvixtech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/insights"
  to = "/case-studies"
  status = 301

